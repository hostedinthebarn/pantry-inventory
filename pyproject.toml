[project]
name = "pantry-inventory-dev"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "home-assistant-frontend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/integration"]
pythonpath = ["."]

[tool.uv]
# HA 2026.10.4 pins Pillow==12.3.0, which carries ~40 Dependabot alerts fixed in 13.0.0.
# Test-env only: the component itself ships no Python requirements (manifest.json).
override-dependencies = ["pillow>=13.0.0"]
